; Card Craft — PlatformIO project configuration.
;
; A first-person survival raycaster. One env per board: board-specific code
; lives in src/hal/hal_<board>.cpp, selected by the -D BOARD_<X> flag below,
; and nothing in src/ outside hal/ names a device.
;
; Platform: pioarduino (community-maintained espressif32 fork) — the official
; espressif32 platform stopped at Arduino core 2.x, and M5Cardputer needs 3.x.

; A bare `pio run` builds the firmware only. The other envs are opt-in: the
; screenshot tour needs a device attached, and `native` is a test-only env with
; no main() of its own.
[platformio]
default_envs = cardputer

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; -O2 rather than the Arduino default -Os: this is a game, and the raycast and
; span loops are the whole frame budget.
build_flags = -Wall -Wno-unused-function -O3 -falign-functions=16 -falign-loops=16
; -ffast-math is scoped to src/ deliberately — it must not reach M5GFX or the
; Arduino core, where relaxed float semantics buy nothing and could surprise.
;
; -flto was tried here and does not work with this toolchain: it has to be on
; the link line for the plugin to resolve src/'s objects at all, which collects
; the Arduino core, and there it drops app_main() as unreferenced because the
; only caller lives in a precompiled libfreertos.a the optimiser cannot see.
; --undefined=app_main does not save it — the plugin decides visibility before
; the archive is scanned. The inlining it would have bought was got instead by
; batching the per-cell world lookups into world::cellAt().
build_src_flags = -ffast-math

; M5Stack Cardputer and Cardputer ADV. Both carry the same StampS3 module
; (ESP32-S3FN8, 8 MB flash, no PSRAM) and produce the same image: the keyboard
; controller differs (original: IO matrix, ADV: TCA8418) but M5Cardputer picks
; it at runtime, and M5GFX autodetects the display. One firmware.bin, two boards.
[env:cardputer]
board = m5stack-stamps3
board_build.flash_mode = qio
build_flags = ${env.build_flags} -D BOARD_CARDPUTER
lib_deps = m5stack/M5Cardputer@^1.1.1
; The four files in the frame's path are compiled as one translation unit
; through src/unity.cpp, so they are excluded here rather than deleted. See the
; header of that file for why this stands in for -flto.
build_src_filter = +<*> -<world.cpp> -<raycast.cpp> -<game.cpp> -<render.cpp>

; Same firmware with the developer instruments switched on: the frame-time
; overlay, frame-time telemetry over USB CDC, and the screenshot responder
; that regenerates the README images. Not part of the shipped build.
;   pio run -e cardputer-dev -t upload && ./tools/grab-screenshots.py
[env:cardputer-dev]
extends = env:cardputer
build_flags = ${env:cardputer.build_flags} -D SHOW_FPS -D DEV_SERIAL -D ARDUINO_USB_CDC_ON_BOOT=1

; The same dev build with block textures switched off, so the cost of the
; texture sampling can be A/B'd against the grain tile it replaced on one fixed
; scene. Not a shipping configuration.
[env:cardputer-notex]
extends = env:cardputer-dev
build_flags = ${env:cardputer-dev.build_flags} -D NO_TEXTURES

; Host tests for the parts with no hardware in them: the world grid and its
; worldgen, the raycaster, and the survival simulation.  pio test -e native
[env:native]
platform = native
framework =
build_flags = -std=gnu++17 -Wall -I src
build_src_filter = +<world.cpp> +<raycast.cpp> +<game.cpp>
test_build_src = yes
